<svg xmlns="http://www.w3.org/2000/svg" width="512" height="448" viewBox="0 0 512 448">
  <!-- The mascot of the Game Boy Camera captures (see SKILL.md): a round
       chick, chiptune fan, with big headphones and notes around. Render it
       with: rsvg-convert -w 512 -h 448 mascot.svg -o mascot.png -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%"><stop offset="0" stop-color="#f1eee8"/><stop offset="1" stop-color="#c7c0b4"/></radialGradient>
    <radialGradient id="body" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.7" stop-color="#f2c330"/><stop offset="1" stop-color="#c4901a"/></radialGradient>
    <linearGradient id="phones" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6b6b"/><stop offset="1" stop-color="#232323"/></linearGradient>
  </defs>
  <rect width="512" height="448" fill="url(#bg)"/>
  <ellipse cx="256" cy="418" rx="115" ry="14" fill="#000" opacity="0.18"/>
  <!-- notes -->
  <g fill="#5d5d5d">
    <path d="M96 150 v-50 l 34 -10 v 46" stroke="#5d5d5d" stroke-width="6" fill="none"/>
    <ellipse cx="88" cy="152" rx="13" ry="10"/><ellipse cx="122" cy="138" rx="13" ry="10"/>
    <path d="M410 120 v-48" stroke="#5d5d5d" stroke-width="6"/><ellipse cx="402" cy="122" rx="13" ry="10"/>
    <path d="M410 72 q 20 8 18 30" stroke="#5d5d5d" stroke-width="6" fill="none"/>
  </g>
  <!-- feet -->
  <path d="M206 392 l -20 18 h 44 Z M306 392 l -20 18 h 44 Z" fill="#e0782a" stroke="#8a4410" stroke-width="3" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="256" cy="262" rx="140" ry="138" fill="url(#body)" stroke="#8a6410" stroke-width="4"/>
  <!-- tuft -->
  <path d="M248 128 C 236 96, 252 84, 258 104 C 262 84, 284 90, 266 128 Z" fill="#f2c330" stroke="#8a6410" stroke-width="3"/>
  <!-- wings -->
  <path d="M122 270 C 90 280, 92 320, 130 318" fill="#e6b22a" stroke="#8a6410" stroke-width="3"/>
  <path d="M390 270 C 422 280, 420 320, 382 318" fill="#e6b22a" stroke="#8a6410" stroke-width="3"/>
  <!-- headphones -->
  <path d="M132 230 C 132 120, 380 120, 380 230" stroke="url(#phones)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <rect x="104" y="208" width="44" height="78" rx="18" fill="url(#phones)" stroke="#111" stroke-width="3"/>
  <rect x="364" y="208" width="44" height="78" rx="18" fill="url(#phones)" stroke="#111" stroke-width="3"/>
  <!-- eyes, happy closed -->
  <path d="M200 236 Q 216 216 232 236" stroke="#2a2010" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M280 236 Q 296 216 312 236" stroke="#2a2010" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="196" cy="268" rx="16" ry="9" fill="#ef8d6a" opacity="0.8"/>
  <ellipse cx="316" cy="268" rx="16" ry="9" fill="#ef8d6a" opacity="0.8"/>
  <!-- beak, singing -->
  <path d="M234 258 L 278 258 L 256 296 Z" fill="#e0782a" stroke="#8a4410" stroke-width="3" stroke-linejoin="round"/>
  <path d="M240 266 L 272 266" stroke="#8a4410" stroke-width="3"/>
</svg>
