name: Benchmarks

# Runs the benchmarks of a pull request and of its base branch on the same
# runner, and posts the differences on the pull request, in a comment
# updated on every push (see tools/benchcompare.sh and tools/benchreport).
# The report is informative: the job does not fail on a regression.
on:
  pull_request: # opened, new commits pushed, reopened

permissions:
  contents: read
  pull-requests: write # to comment on the pull request

concurrency:
  # A new push to the pull request cancels the run on the previous commit.
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base commit is needed too
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check out the base branch
        run: git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
      # About 5 minutes. The checkout of the pull request is GitHub's merge
      # of it into the base branch: what would be merged.
      - name: Run the benchmarks of both sides, interleaved
        run: tools/benchcompare.sh "$RUNNER_TEMP/base" . 10 "$RUNNER_TEMP/bench"
      - name: Write the report
        run: |
          go run ./tools/benchreport \
            -base "$BASE_REF (${BASE_SHA::7})" -head "#$PR (${HEAD_SHA::7})" \
            -note "Runs interleaved on the same GitHub runner; the pull request is measured merged into $BASE_REF." \
            "$RUNNER_TEMP/bench/base.txt" "$RUNNER_TEMP/bench/head.txt" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            ${{ runner.temp }}/bench/*.txt
            ${{ runner.temp }}/report.md
      # The token of a pull request from a fork cannot comment: the report
      # is then only in the summary of the run.
      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- gbe-benchmarks -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/report.md" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/report.md" > /dev/null
          fi
