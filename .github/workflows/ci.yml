name: CI

# Checks that every pull request builds and passes the tests. Nothing is
# kept: binaries are only published by "Release binaries". A pull request
# that only changes the site or the Claude Code skills has no Go code to
# check: it is skipped, and "Site" renders the site instead.
on:
  pull_request: # opened, new commits pushed, reopened
    paths-ignore: # skipped only when every changed file matches
      - site/**
      - screenshots/**
      - .claude/**

permissions:
  contents: read

concurrency:
  # A new push to the pull request cancels the run on the previous commit.
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The tests on games and test ROMs are skipped: they are not in the
      # repository. Those on the benchmark ROM (benchrom/) run. Their
      # coverage goes to the coverage job (-count=1: a cached test writes
      # none).
      - run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          go test -count=1 -cover ./... -args -test.gocoverdir="$RUNNER_TEMP/coverage"
        env:
          GBE_GOLDEN_OUT: ${{ runner.temp }}/golden
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-tests
          path: ${{ runner.temp }}/coverage
      # Frames and audio of the benchmark ROM runs that failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: ${{ runner.temp }}/golden
          if-no-files-found: ignore

  # The webcam of Linux read for real (internal/webcam, Video4Linux2): a
  # virtual camera, v4l2loopback, fed a test pattern by ffmpeg.
  webcam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install a virtual camera
        run: |
          sudo apt-get update
          # videodev, which v4l2loopback needs, is in the extra modules of
          # the Azure kernel.
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)" \
            "linux-modules-extra-$(uname -r)" v4l2loopback-dkms ffmpeg
          sudo modprobe videodev
          sudo modprobe v4l2loopback devices=1 video_nr=9 card_label="gbe test camera" exclusive_caps=1 \
            || { sudo dmesg | tail -20; exit 1; }
          sudo udevadm settle # udev sets its own permissions on the node first
          sudo chmod 666 /dev/video9
      - name: Read it
        run: |
          ffmpeg -nostdin -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 \
            -pix_fmt yuyv422 -f v4l2 /dev/video9 &
          sleep 3
          go test -count=1 -v ./internal/webcam -run TestRealCamera
        env:
          GBE_WEBCAM: "1"
          GBE_WEBCAM_ID: /dev/video9
          GBE_WEBCAM_WANT: gbe test camera

  # The webcam of Windows (internal/webcam, Media Foundation through COM):
  # without a camera, the runner checks the calls that list them.
  webcam-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./internal/webcam ./internal/ui
      - run: go test -count=1 -v ./internal/webcam
        env:
          GBE_WEBCAM_LIST: "1"

  # The tests that draw through Ebitengine (see internal/rendertest): under
  # a virtual display, drawn by Mesa on the CPU.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install a virtual display and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libgl1-mesa-dri \
            libxcursor1 libxi6 libxinerama1 libxrandr2 libxxf86vm1
      - run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            go test -count=1 -cover ./internal/ui/... -args -test.gocoverdir="$RUNNER_TEMP/coverage"
        env:
          GBE_RENDER: "1"
          GBE_GOLDEN_OUT: ${{ runner.temp }}/golden
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-render
          path: ${{ runner.temp }}/coverage
      # The images that differ, with a map of the differences.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-failures
          path: ${{ runner.temp }}/golden
          if-no-files-found: ignore

  # The coverage of the tests and of the rendering tests, merged: every
  # package must keep its floor (tools/coverage-thresholds.txt). The table
  # is posted on the pull request, in a comment updated on every push, as
  # the benchmarks report, and in the summary of the run.
  coverage:
    needs: [test, render]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment on the pull request
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: coverage-tests
          path: ${{ runner.temp }}/coverage-tests
      - uses: actions/download-artifact@v4
        with:
          name: coverage-render
          path: ${{ runner.temp }}/coverage-render
      - name: Check the floors
        run: tools/coverage.sh "$RUNNER_TEMP/coverage-tests" "$RUNNER_TEMP/coverage-render"
        env:
          COVERAGE_REPORT: ${{ runner.temp }}/coverage.md
      # Also when a package is under its floor: the report says which.
      - name: Summary of the run
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/coverage.md" ]; then
            cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The token of a pull request from a fork cannot comment: the report
      # is then only in the summary of the run.
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # No report when the coverage could not be measured at all.
          [ -f "$RUNNER_TEMP/coverage.md" ] || exit 0
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- gbe-coverage -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/coverage.md" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/coverage.md" > /dev/null
          fi

  benchrom:
    runs-on: ubuntu-latest
    env:
      RGBDS_VERSION: v1.0.4
      RGBDS_SHA256: 3e19e50ea602e316be709160acaf0a708b1fa6d32d219ec541f244442895dbb7
    steps:
      - uses: actions/checkout@v5
      - name: Install RGBDS
        run: |
          curl -sSfL -o rgbds.tar.xz "https://github.com/gbdev/rgbds/releases/download/$RGBDS_VERSION/rgbds-linux-x86_64.tar.xz"
          echo "$RGBDS_SHA256  rgbds.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/rgbds"
          tar -xJf rgbds.tar.xz -C "$RUNNER_TEMP/rgbds"
          rm rgbds.tar.xz
          echo "$RUNNER_TEMP/rgbds" >> "$GITHUB_PATH"
      - name: Check that the committed benchmark ROM matches its sources
        run: |
          make -C benchrom clean
          make -C benchrom
          git diff --exit-code --stat benchrom/gbe-bench.gbc

  build:
    runs-on: ubuntu-latest
    env:
      # Same settings as the release: pure Go, cross-compiled from Linux.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build for every release platform
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
            echo "::endgroup::"
          done
