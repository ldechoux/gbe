name: Release binaries

# Builds gbe for macOS, Linux and Windows (amd64 + arm64) and attaches the
# archives to the GitHub release that triggered the run, with gbe.app for
# macOS in a disk image.
on:
  release:
    types: [published]
  workflow_dispatch: # manual run: binaries are kept as workflow artifacts only

permissions:
  contents: write # needed to upload release assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # ROM-based tests are skipped: ROMs are not in the repository.
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64, os: macos }
          - { goos: darwin, goarch: arm64, os: macos }
          - { goos: linux, goarch: amd64, os: linux }
          - { goos: linux, goarch: arm64, os: linux }
          - { goos: windows, goarch: amd64, os: windows }
          - { goos: windows, goarch: arm64, os: windows }
    env:
      # Pure Go on every platform: Ebitengine loads the system libraries
      # (Cocoa, X11/GL, ALSA, Win32) at runtime through purego.
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then
            ext=".exe"
            # The icon of gbe.exe and the version in its properties, which
            # go build links from cmd/gbe/rsrc_windows_<arch>.syso. Numbers
            # only: 0.0.0 for a build that is not a release.
            v=$(echo "$VERSION" | sed -n 's/^v\{0,1\}\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
            GOOS=linux GOARCH=amd64 go run github.com/tc-hib/go-winres@v0.3.3 make \
              --in packaging/windows/winres.json --out cmd/gbe/rsrc --arch "$GOARCH" \
              --product-version "${v:-0.0.0}" --file-version "${v:-0.0.0}"
          fi
          name="gbe-${VERSION}-${{ matrix.os }}-${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/$name/gbe$ext" ./cmd/gbe
          cp README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gbe-${{ matrix.os }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  # gbe.app, for Intel and Apple Silicon, in a disk image: lipo, codesign
  # and hdiutil only exist on macOS.
  macos-app:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build gbe.app and its disk image
        run: echo "ASSET=$(packaging/macos/build.sh "$VERSION" dist)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: gbe-macos-app
          path: ${{ env.ASSET }}
          compression-level: 0 # a disk image is compressed already

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
